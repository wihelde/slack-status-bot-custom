name: Link to GitLab release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing mirrored release tag, for example v2.3.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; no change."
            exit 0
          fi
          printf '[Download und Release-Notes auf GitLab](https://gitlab.com/wihel_de/slack-status-bot-custom/-/releases/%s)\n' "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md
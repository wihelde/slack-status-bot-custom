stages:
  - release

create_release:
  stage: release
  image: curlimages/curl:latest
  script:
    - VERSION="$CI_COMMIT_TAG"
    - echo "Creating release for $VERSION"
    - ASSET_URL="$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/app/dist/Slack%20Status%20Bot-${VERSION#v}-arm64.dmg"
    - echo "Asset URL $ASSET_URL"
    - >-
      curl --request POST
      --header "PRIVATE-TOKEN:$CI_JOB_TOKEN"
      --data "name=Release $VERSION&tag_name=$VERSION"
      "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases"
    - >-
      curl --request POST
      --header "PRIVATE-TOKEN:$CI_JOB_TOKEN"
      --form "name=Slack Status Bot macOS"
      --form "url=$ASSET_URL"
      "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases/$VERSION/assets/links"
  only:
    - tags

stages:
  - release

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Release job started for $CI_COMMIT_TAG"
    - export VERSION=${CI_COMMIT_TAG#v}
    - echo "Version extracted: $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: 'Slack Status Bot Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Slack Status Bot macOS (arm64)'
          url: '$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/app/dist/Slack Status Bot-$VERSION-arm64.dmg'
          link_type: 'package'
  only:
    - tags

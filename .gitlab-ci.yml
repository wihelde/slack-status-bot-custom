
stages:
  - test
  - release

app_checks:
  stage: test
  image: node:22.22.2-bookworm-slim
  tags:
    - home-linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd app
    # The host is compiled, not launched; skip the Electron binary installer.
    - npm ci --ignore-scripts
    - npm test
    - npm run host:smoke
    - npm run react-build

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    # Create release with asset links in JSON format
    - release-cli create 
      --tag-name $CI_COMMIT_TAG 
      --name "Release $CI_COMMIT_TAG" 
      --description "Slack Status Bot Release $CI_COMMIT_TAG" 
      --assets-link "{\"name\":\"Slack Status Bot macOS (dmg)\",\"url\":\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/app/dist/Slack Status Bot-$VERSION-arm64.dmg\",\"link_type\":\"package\"}"
      #--assets-link "{\"name\":\"Slack Status Bot macOS (zip)\",\"url\":\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/app/dist/Slack Status Bot-$VERSION-arm64-mac.zip\",\"link_type\":\"package\"}"
      #--assets-link "{\"name\":\"latest-mac.yml\",\"url\":\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/app/dist/latest-mac.yml\",\"link_type\":\"other\"}"
  only:
    - tags

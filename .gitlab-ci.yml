
stages:
  - test
  - release

app_checks:
  stage: test
  image: node:22.22.2-bookworm-slim
  tags:
    - home-linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # App checks do not need release installers or repository history.
    GIT_LFS_SKIP_SMUDGE: "1"
    GIT_DEPTH: "1"
    GIT_STRATEGY: clone
    XDG_CURRENT_DESKTOP: GNOME
  before_script:
    # npx avoids npm 10 replacing its own modules during the npm 12 upgrade.
    - export PROJECT_NPM_VERSION=$(node -p 'require("./package.json").engines.npm')
    - npx --yes "npm@$PROJECT_NPM_VERSION" install --global "npm@$PROJECT_NPM_VERSION"
    - node --version
    - npm --version
    - apt-get update
    - apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 dbus gnome-keyring libsecret-1-0
  script:
    # The package test gets its runtime from electron-builder; skip the dev installer.
    - npm ci --ignore-scripts
    - npm run test:coverage
    # A disposable keyring supplies real secure storage to the Linux app.
    - dbus-run-session -- xvfb-run -a bash -ec 'printf ci-test-keyring | gnome-keyring-daemon --unlock --components=secrets; npm run package:smoke'

  coverage: '/^Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    expose_as: 'App coverage'
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    # Create release with asset links in JSON format
    - release-cli create 
      --tag-name $CI_COMMIT_TAG 
      --name "Release $CI_COMMIT_TAG" 
      --description "Slack Status Bot Release $CI_COMMIT_TAG" 
      --assets-link "{\"name\":\"Slack Status Bot macOS (dmg)\",\"url\":\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/dist/Slack Status Bot-$VERSION-arm64.dmg\",\"link_type\":\"package\"}"
      #--assets-link "{\"name\":\"Slack Status Bot macOS (zip)\",\"url\":\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/dist/Slack Status Bot-$VERSION-arm64-mac.zip\",\"link_type\":\"package\"}"
      #--assets-link "{\"name\":\"latest-mac.yml\",\"url\":\"$CI_SERVER_URL/$CI_PROJECT_PATH/-/raw/$CI_COMMIT_TAG/dist/latest-mac.yml\",\"link_type\":\"other\"}"
  only:
    - tags
